# Example of data/trust.yaml. You normally don't write this by hand: ./atf asks for it on first run (Settings).
# data/ is never shared or committed (it holds personal data).
applicant_type: trust                     # trust (default) or individual
trust:                                    # (trust only)
  name: "Example Family Trust"            # exactly as on the trust document
responsible_persons:                      # only the first entry is used
  - title: "Settlor"                      # your title in the trust (typed into eForms as "title of the submitter")
    dob: "MM/DD/YYYY"
    sex: "Male"                           # as the eForms dropdown lists it: Male / Female
    race: "White"                         # must match the eForms race option text
    place_of_birth: {country: "United States of America", state: "Texas"}
    home_address: {state: "Texas"}        # state of residence
cleo:                                     # chief law enforcement officer: typed into eForms and stamped on the 5320.23
  department: "EXAMPLE POLICE DEPARTMENT"
  official: "FIRST LAST"
  title: "CHIEF OF POLICE"                # must match the title on your 5320.23 template
  address: {street: "1 MAIN ST", zip: "00000", city: "EXAMPLE", county: "EXAMPLE", state: "Texas"}
firearm:                                  # same for every suppressor
  model: "N/A"
  overall_length: "12"                    # inches
  description: "I POSSESS NO PARTS OR PLANS, AND WILL NOT PURCHASE OR MANUFACTURE ANY PARTS UNTIL A FORM 1 IS APPROVED"
files:
  trust_document: "/abs/path/to/trust.pdf"
  trust_document_desc: "TRUST"
  eft: "/abs/path/to/fingerprints.eft"
  photo: "/abs/path/to/photo.jpg"         # required by eForms for the responsible person (not needed on the 5320.23)
docs:                                     # supporting documents uploaded with each firearm (any number)
  - {path: "/abs/path/to/printer.jpg", description: "3D PRINTER"}
# As an individual (applicant_type: individual) there is no trust: or files.trust_document, and no 5320.23 template.
# The wizard asks ATF's questions 11.A-11.M.1 and saves the answers (it only files when all are No):
# individual:
#   upin: ""                              # Unique Personal Identification Number, if ATF issued you one
#   answers: {"11.A": "No", "11.B": "No", "11.C": "No", "11.D": "No", "11.E": "No", "11.F": "No", "11.G": "No",
#             "11.H": "No", "11.I": "No", "11.J": "No", "11.K": "No", "11.L": "No", "11.M.1": "No"}
