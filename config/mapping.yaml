# eForms Form 1 (trust, suppressor) portal steps. Shared by everyone: NO personal data in this file.
# {placeholders} come from data/trust.yaml (your settings) and the suppressor row (see _row_context in src/atf.py).
# Selectors were captured from the live portal on 2026-10-08/09; if ATF changes the site, re-capture with
# ./atf > Advanced > Capture portal pages (see CLAUDE.md "When the portal changes").
#
# actions: fill | select | check | click | upload | expect | dismiss_dialog | pause | press | wait | wait_for
#          | section (progress marker shown in the ./atf menu) | repeat (run `steps` once per item in a list setting)
# options: optional: true (click only if present) | skip_if_disabled: true
#          | tag: ssn (left out unless you choose to type your SSN) | label / private on expect steps
#          | only: trust / only: individual (the applicant type in your settings) | if_set: <setting> (skip if empty)
#          | count: true on expect (compare how many elements match, e.g. rows in a list)
portal:
  steps:
    # --- applicant-type ---
    - {action: section, value: "Applicant type"}
    - {selector: "#Trust", action: check, only: trust}
    - {selector: "#Individual", action: check, only: individual}
    - {selector: "#nextBtn", action: click}
    # --- intended-use ---
    - {action: section, value: "Intended use"}
    - {selector: "#nextBtn", action: click}
    # --- application ---
    - {action: section, value: "Application"}
    - {selector: "#taxPaid", action: check}
    # Internal Control Number = your own reference for the form: the serial (Settings; off = left empty), so the eForms
    # dashboard can be searched by serial. Read back here: a box that cut it short would block submitting.
    - {selector: "#internalControlNumber", action: fill, value: "{icn}", if_set: icn}
    - {selector: "#internalControlNumber", action: expect, label: "Internal control number", value: "{icn}", exact: true, if_set: icn}
    - {selector: "#nextBtn", action: click}
    # --- applicant ---
    - {action: section, value: "Applicant"}
    - {selector: "#noFFL", action: check}            # confirm: trust has no FFL
    # address/phone/email come pre-filled from the eForms account; nothing to do
    - {selector: "#tradeName", action: fill, value: "{trust_name}", only: trust}
    - {selector: "#titleOfTheSubmitter", action: fill, value: "{rp_title}", only: trust}
    # individual: questions 11.A-11.M.2 (answers saved in your settings; all must be No, 11.M.2 = N/A).
    # The page loads your profile after it appears and once wiped answers picked too early: wait for it, pick all
    # answers quickly, then check_picks reads them all back and re-picks any the page lost (twice at most, else stop).
    - {selector: "[id='11.A']", action: wait_for, value: "20000", only: individual}
    - {action: wait, value: "2500", only: individual}
    - action: check_picks
      only: individual
      steps:
        - action: repeat
          over: answers
          steps:
            - {selector: "[id='{q_id}']", action: select, value: "{q_answer}"}
        - {selector: "[id='17.Aanswer']", action: select, value: "US"}   # item 16 country of citizenship: US (NON-US not supported)
    - {selector: "[id='14answer']", action: fill, value: "{upin}", only: individual, if_set: upin}   # item 13: UPIN, if you have one
    - action: repeat
      over: answers
      only: individual
      steps:
        - {selector: "[id='{q_id}']", action: expect, label: "{q_id} (applicant page)", value: "{q_answer}", exact: true}
    - {selector: "[id='17.Aanswer']", action: expect, label: "Citizenship (applicant page)", value: "US", exact: true, only: individual}
    - {selector: "#nextBtn", action: click}
    # --- responsible-persons: edit popup for you (row 0, from your eForms account; an individual gets the same popup) ---
    - {action: section, value: "Responsible person"}
    - {selector: "[id='0Edit']", action: click}
    - {selector: "#citizenType", action: select, value: "U.S.CITIZEN", skip_if_disabled: true}   # locked for individuals; country autofills
    - {selector: "#formFile", action: upload, value: "{form_5320_path}", only: trust}  # 5320.23 generated per suppressor
    - {selector: "#photoFile", action: upload, value: "{photo_path}"}   # required by eForms (not needed on the 5320.23 PDF)
    - {selector: "#eftFile", action: upload, value: "{eft_path}"}
    # popup after the fingerprint attaches: waits up to 60 s for "Valid EBTS Package"; anything else blocks submitting
    - {action: dismiss_dialog, value: "60000", require: "Valid EBTS Package", about: "EBTS"}
    - {action: pause, tag: ssn, note: "Type your SSN into the SSN field yourself (script never enters it)"}
    - {selector: "#dateOfBirth", action: fill, value: "{rp_dob}"}
    - {selector: "#birthCountry", action: select, value: "UNITED STATES OF AMERICA"}
    - {action: wait, value: "800"}   # birthState is disabled until country is chosen
    - {selector: "#birthState", action: select, value: "{rp_birth_state}"}
    - {selector: "#stateOfResidence", action: select, value: "{rp_residence_state}"}
    - {selector: "#sex", action: select, value: "{rp_sex}"}
    # race/ethnicity: PrimeNG multiselect, option panel is an overlay (your race setting must match the option text)
    - {selector: "#raceEthnicity .ui-multiselect", action: click}
    - {selector: ".ui-multiselect-panel li.ui-multiselect-item:has-text('{rp_race}')", action: click}
    - {action: press, value: "Escape"}
    - {selector: "#finishButton", action: click}
    # --- other responsible persons in the trust (Settings), each with "Add Responsible Person" ---
    # The same popup as yours (field ids from a capture of it, 2026-10-11), but nothing comes from an eForms account:
    # name, address and email are typed in. Practice run passed live 2026-10-22; not yet a real filing.
    - action: repeat
      over: other_rps
      only: trust
      steps:
        - {action: section, value: "Responsible person {rp_n}"}
        - {selector: "#addResponsiblePerson", action: wait_for, value: "10000", state: visible}
        - {selector: "#addResponsiblePerson", action: click}
        - {selector: "#citizenType", action: select, value: "U.S.CITIZEN"}
        - {action: wait, value: "800"}   # citizenship country fills in
        - {selector: "#title", action: fill, value: "{rp_title}"}
        - {selector: "#firstName", action: fill, value: "{rp_first_name}"}
        - {selector: "#middleNameDetail", action: select, value: "{rp_middle_detail}"}
        - {selector: "#middleName", action: fill, value: "{rp_middle_name}", if_set: rp_middle_name}
        - {selector: "#lastName", action: fill, value: "{rp_last_name}"}
        - {selector: "#cadence", action: select, value: "{rp_suffix}", if_set: rp_suffix}   # Jr, Sr, II...
        - {selector: "#emailAddress", action: fill, value: "{rp_email}", if_set: rp_email}
        - {selector: "#formFile", action: upload, value: "{form_5320_path}"}   # THEIR 5320.23, stamped per suppressor
        - {selector: "#photoFile", action: upload, value: "{photo_path}"}
        - {selector: "#eftFile", action: upload, value: "{eft_path}"}
        - {action: dismiss_dialog, value: "60000", require: "Valid EBTS Package", about: "EBTS"}
        - {action: pause, tag: ssn, note: "Type the SSN of responsible person {rp_n} ({rp_title}) into the SSN field yourself (script never enters it)"}
        - {selector: "#street", action: fill, value: "{rp_street}"}
        - {selector: "#zipCode", action: fill, value: "{rp_zip}"}
        - {action: wait, value: "1500"}   # state/city dropdowns populate from the ZIP
        - {selector: "#state", action: select, value: "{rp_state}"}
        - {selector: "select[name='city']", action: select, value: "{rp_city}"}
        - {selector: "#dateOfBirth", action: fill, value: "{rp_dob}"}
        - {selector: "#birthCountry", action: select, value: "UNITED STATES OF AMERICA"}
        - {action: wait, value: "800"}   # birthState is disabled until country is chosen
        - {selector: "#birthState", action: select, value: "{rp_birth_state}"}
        - {selector: "#stateOfResidence", action: select, value: "{rp_residence_state}"}
        - {selector: "#sex", action: select, value: "{rp_sex}"}
        - {selector: "#raceEthnicity .ui-multiselect", action: click}
        - {selector: ".ui-multiselect-panel li.ui-multiselect-item:has-text('{rp_race}')", action: click}
        - {action: press, value: "Escape"}
        - {selector: "#finishButton", action: click}
        # read back: the list now has their row (row n-1; yours is 0) with their last name
        - {selector: "[id='{rp_edit}']", action: wait_for, value: "10000"}
        - {selector: "tr:has([id='{rp_edit}'])", action: expect, label: "Responsible person {rp_n} (list)", private: true, value: "{rp_last_name}"}
    # exactly you + the others in your settings (none left over from an earlier attempt, none missing)
    - {selector: "input[id$='Edit']", action: expect, count: true, label: "Responsible persons listed", value: "{rp_count}", exact: true, only: trust, if_set: has_other_rps}
    - {selector: "#nextBtn", action: click}
    # --- cleo ---
    - {action: section, value: "CLEO"}
    - {selector: "#cleoAgencyOrDepartmentName", action: fill, value: "{cleo_department}"}
    - {selector: "#cleonameOfAgencyOfficial", action: fill, value: "{cleo_official}"}
    - {selector: "#cleoTitleOfAgencyOfficial", action: fill, value: "{cleo_title}"}
    # #cleoAddress-country is locked (prefilled); nothing to do
    - {selector: "#cleoAddress-addressLine1", action: fill, value: "{cleo_street}"}
    - {selector: "#cleoAddress-zipCode", action: fill, value: "{cleo_zip}"}
    - {action: wait, value: "1500"}   # city/county/state dropdowns populate from zip
    # fix: shown when the ZIP's dropdown doesn't offer the setting (e.g. a misspelled county)
    - {selector: "#cleoAddress-city", action: select, value: "{cleo_city}", fix: "Check the CLEO city and ZIP in Settings > All settings"}
    - {selector: "#cleoAddress-county", action: select, value: "{cleo_county}", fix: "Check the CLEO county and ZIP in Settings > All settings"}
    - {selector: "#cleoAddress-state", action: select, value: "{cleo_state}", fix: "Check the CLEO state and ZIP in Settings > All settings"}
    - {selector: "#nextBtn", action: click}
    # --- line-item: add firearm, popup 1 (manufacturer) ---
    - {action: section, value: "Firearm: manufacturer"}
    - {selector: "#addFirearm", action: click}
    # FMI ("Form 1 registration": maker = the applicant) for a suppressor, by code. An SBR etc. made from an existing
    # receiver uses the ORIGINAL manufacturer (the portal: "Only use ... FMI if serialized part is wholly manufactured
    # by Registrant"): found with the popup's own name search from the name marked on the receiver, the code then kept
    # with the row (mapped live 2026-11-19: "aero prec" -> AERO PRECISION INC / LLC; LLC verified = AP2). atf.py
    # _pick_manufacturer does both, and clicks Verify Manufacturer.
    - {action: pick_manufacturer}
    - {selector: "#closeVerifiedManufacturerModal", action: click}
    - {selector: "#country", action: select, value: "{mfr_country}", skip_if_disabled: true}   # skipped if locked/prefilled
    - {selector: "#nextButton", action: click}
    # --- firearm popup 2 ---
    - {action: section, value: "Firearm: details"}
    - {selector: "#productType", action: select, value: "{product_type}"}
    - {action: wait, value: "500"}          # form re-renders (SILENCER: caliber free text, barrel length hidden)
    # Other types with a real manufacturer: Model is an ng-select of ATF's list for that maker and Caliber a select.
    # "My item description is not in the list" turns both into the same text inputs a silencer has, so the model is
    # typed as engraved (live 2026-11-19). Barrel length only exists for these types.
    - {selector: "#descriptionNotListed", action: check, if_set: nfa}
    - {action: wait, value: "800", if_set: nfa}
    - {selector: "#weaponModel", action: fill, value: "{model}"}
    - {selector: "#weaponCaliber", action: fill, value: "{caliber}"}
    - {selector: "#serialNumber", action: fill, value: "{serial_number}"}
    - {selector: "#unitOfMeasure", action: select, value: "{unit}"}   # CALIBER; GAUGE for a shotgun
    - {selector: "#barrelLength", action: fill, value: "{barrel_length}", if_set: nfa}
    - {selector: "#overallLength", action: fill, value: "{overall_length}"}
    - {selector: "#description", action: fill, value: "{description}"}
    # #descriptionNotListed stays unchecked
    - {selector: "#nextButton", action: click}
    # --- firearm popup 3: supporting documentation (each entry under docs: in your settings) ---
    - {action: section, value: "Firearm: supporting documents"}
    - action: repeat
      over: docs
      steps:
        - {selector: "#file-upload", action: upload, value: "{doc_path}"}
        - {selector: "#description", action: fill, value: "{doc_desc}"}
        - {selector: "#addDocument", action: click}
        # wait until it is listed: the portal saves it in the background and then clears the form, so the next file
        # must not go in before that (2026-10-22: a 1 s wait was too short; the next one was wiped, Add stayed disabled)
        - {selector: "td:has-text({doc_file})", action: wait_for, value: "30000"}
    - {selector: "#finishButton", action: click}
    - {action: wait, value: "1500"}
    - {selector: "#nextBtn", action: click}   # line-item page -> next
    # --- attachments: trust document (individuals: nothing to attach) ---
    - {action: section, value: "Trust document", only: trust}
    - {selector: "#file-upload", action: upload, value: "{trust_doc_path}", only: trust}
    - {selector: "#documentType", action: select, value: "CORPORATION/TRUST/OTHER LEGAL ENTITY", only: trust}
    - {selector: "#description", action: fill, value: "{trust_doc_desc}", only: trust}
    - {selector: "#addDocument", action: click, only: trust}
    - {selector: "td:has-text({trust_doc_file})", action: wait_for, value: "30000", only: trust}   # listed: saved
    - {action: section, value: "Attachments", only: individual}
    - {selector: "#nextBtn", action: click}
    # --- verify page: read back what the portal will certify (read-only) ---
    - {action: section, value: "Read-back check"}
    - {action: wait, value: "1500"}
    - {selector: "#serialNumberMessage", action: expect, label: "Serial number", value: "{serial_number}"}
    - {selector: "#model", action: expect, label: "Model", value: "{model}"}
    - {selector: "#weaponType", action: expect, label: "Type", value: "{product_type}"}
    - {selector: "#caliber", action: expect, label: "Caliber", value: "{caliber}"}
    - {selector: "#overallLength", action: expect, label: "Overall length", value: "{overall_length}"}
    # verify page shows "Barrel Length" for these types; id not read live yet (assumed): a practice run confirms it
    - {selector: "#barrelLength", action: expect, label: "Barrel length", value: "{barrel_length}", if_set: nfa}
    - {selector: "#businessName >> nth=0", action: expect, label: "Trust name", private: true, value: "{trust_name}", only: trust}
    - action: repeat
      over: answers
      only: individual
      steps:
        - {selector: "[id='{q_id}'] >> nth=0", action: expect, label: "Answer {q_id}", value: "{q_answer}", exact: true}
    - {selector: "#question17a", action: expect, label: "Citizenship", value: "UNITED STATES", exact: true, only: individual}   # the verify page spells it out
    # Submitting (verify box, Certify page, Sign & Submit) is in _submit() in src/atf.py, gated on these checks.
  # --- start a NEW Form 1 from the home page (first row and between rows) ---
  # After a submission the portal is on the home page; the confirmation Ok is normally already clicked.
  # If any of these fail, the script falls back to asking you to do it by hand.
  new_form_steps:
    - {selector: "#OkBtn", action: click, optional: true}       # leftover confirmation popup, if still open
    - {selector: "#FORM53201LinkId", action: click}             # "ATF Form 1 (5320.1)" link (href /home/form/FORM53201)
    - {selector: "#Trust", action: wait_for, value: "30000"}    # applicant-type page has loaded
