<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventory">
<meta name="referrer" content="no-referrer">
<title>Inventory</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1f1e1d;--muted:#6b6a65;--line:rgba(31,30,29,.12);--line2:rgba(31,30,29,.24);
--accent:#2c6ecb;--accent-bg:#e6f0fb;--ok:#3b7a17;--ok-bg:#e8f3dc;--ok-fill:#4f9a2a;--warn:#8a5208;--warn-bg:#fbefd9;
--pro:#5146b0;--pro-bg:#eeedfe;--off:#d6d4cd;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--text:#f0efe9;--muted:#a3a19a;--line:rgba(255,255,255,.1);
--line2:rgba(255,255,255,.22);--accent:#7fb2f0;--accent-bg:#1d3350;--ok:#a6d77f;--ok-bg:#24391a;--ok-fill:#5aa832;--warn:#f2c46f;
--warn-bg:#40300f;--pro:#b9b3f6;--pro-bg:#2e2a55;--off:#4a4945}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:12px 12px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:760px){.wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.back{display:none!important}}
@media (max-width:759px){body.detail #listView{display:none}body:not(.detail) #detailView{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 12px}
h1{font-size:24px;font-weight:600;margin:4px 4px 0}
.sum{font-size:13px;color:var(--muted);margin:0 4px 12px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;height:44px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;background:var(--card);font-size:17px}
.search button{height:44px;min-width:56px;border:1px solid var(--line2);border-radius:12px;background:transparent;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chip{flex:none;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:transparent}
.chip.on{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.row.sel{background:var(--bg);border-radius:10px}
.serial{font-family:var(--mono);font-size:17px;font-weight:600}
.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;font-size:12px;padding:3px 9px;border-radius:999px}
.p-built{background:var(--ok-bg);color:var(--ok)}.p-approved{background:var(--accent-bg);color:var(--accent)}
.p-filed,.p-pending{background:var(--warn-bg);color:var(--warn)}.p-queued,.p-disapproved{background:var(--line);color:var(--muted)}
.p-sbr{background:var(--pro-bg);color:var(--pro)}
.back{display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--accent);font-size:16px;padding:4px 2px 10px}
.big{font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:.5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);font-size:14px;padding:10px 12px;border-radius:12px;margin:10px 0}
.build{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:16px}
.sw{position:relative;width:52px;height:32px;border-radius:999px;border:0;background:var(--off);flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--ok-fill)}.sw[aria-checked=true]::after{left:23px}
.sw:disabled{opacity:.4}
.design{display:flex;gap:8px;margin-top:12px}
.design input{flex:1;min-width:0;height:44px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;background:var(--card)}
.save{height:44px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:#fff}
.ask{margin-top:12px;font-size:15px}.ask .design{margin-top:8px}.ask button{flex:1}
.keep{height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--card);color:inherit}
a{color:var(--accent);text-decoration:none}
.empty{padding:28px 6px;color:var(--muted);font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
.foot{margin:14px 4px 2px;font-size:14px;color:var(--muted)}.foot button{border:0;background:none;padding:0;color:var(--accent);font-size:14px;cursor:pointer}
.hint{font-size:15px;color:var(--muted);margin:0 4px 8px}.hint code{font-family:var(--mono);font-size:14px}
.hist{margin-top:16px}.hist h2,.devs h2{font-size:15px;font-weight:600;margin:0 0 2px}
.code{font-family:var(--mono);font-size:40px;font-weight:600;letter-spacing:6px;margin:8px 0 2px}
.fp{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.devs .kv button{border:1px solid var(--line2);border-radius:10px;background:transparent;padding:4px 10px;font-size:14px}
body.pairing #detailView{display:none}
</style>
</head>
<body>
<div class="wrap">
  <section class="card" id="listView">
    <h1>Inventory</h1>
    <p class="sum" id="sum">Loading…</p>
    <div class="search">
      <input id="q" type="search" inputmode="numeric" pattern="[0-9]*" placeholder="Serial number, like 83" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Search by serial or design">
      <button id="pad" type="button" aria-label="Switch to letters">ABC</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <div class="foot" id="foot"></div>
  </section>
  <section class="card" id="detailView"></section>
</div>
<div id="toast" role="status"></div>
<script>
const KEY = new URLSearchParams(location.search).get("k") || "";
let items = [], filter = "all", sel = null, asking = null;
// Served by the inventory server (server/): data.server is set, the page asks to pair a device first, shows each row's
// history and Devices, and builds stay read-only until the server records them (can_build). The PC's page has none of that.
let SERVER = null, CAN_BUILD = true, pairCode = null;
const DEVICES = ":devices";  // the Devices screen's #hash (a serial never starts with ":")
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const FILTERS = {all: ["All", () => true], built: ["Built", r => r.built], notbuilt: ["Not built", r => r.status === "approved" && !r.built],
  waiting: ["Waiting", r => r.status === "filed" || r.status === "pending"], queued: ["Queued", r => r.status === "queued"],
  sbr: ["SBRs", r => r.status === "sbr"]};
const PILL = r => r.status === "sbr" ? ["sbr", "SBR"] : r.built ? ["built", "Built"] : r.status === "approved" ? ["approved", "Approved"]
  : r.status === "filed" ? ["filed", "Waiting"] : r.status === "pending" ? ["pending", "Pending"] : [r.status, r.status[0].toUpperCase() + r.status.slice(1)];
const pill = r => { const [c, t] = PILL(r); return `<span class="pill p-${esc(c)}">${esc(t)}</span>`; };

function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2500); }

async function load() {
  const res = await fetch(`/api/inventory?k=${encodeURIComponent(KEY)}`);
  if (res.status === 401) return showPair();
  if (!res.ok) { $("sum").textContent = (await res.json().catch(() => ({}))).error || "Can't reach the helper."; return; }
  const data = await res.json();
  SERVER = data.server || null; CAN_BUILD = data.can_build !== false;
  $("foot").innerHTML = SERVER ? `<button type="button" id="devlink">Devices</button> · <a href="/export.csv">Export CSV</a> · ${esc(SERVER.name)}` : "";
  if ($("devlink")) $("devlink").onclick = () => open(DEVICES);
  items = [...data.suppressors, ...data.sbrs];
  const s = data.suppressors;
  const n = (k, word) => `${k} ${word}${k === 1 ? "" : "s"}`;
  $("sum").textContent = `${n(s.length, "suppressor")} · ${s.filter(r => r.built).length} built · ${s.filter(r => r.status === "approved" && !r.built).length} not built`
    + (data.sbrs.length ? ` · ${n(data.sbrs.length, "SBR")}` : "");
  renderList();
  // A live update mustn't wipe what's being typed (a design) or a question on screen (Keep it / Clear).
  const typing = document.activeElement && document.activeElement.id === "design";
  if (!typing && !asking) renderDetail();
  if (SERVER && !live) listen();
}

// Live updates (server only): the server says when anything changed (this page, another phone, the PC); reload then.
let live = null;
function listen() {
  live = new EventSource("/api/events");
  live.addEventListener("change", () => { clearTimeout(listen.t); listen.t = setTimeout(load, 300); });
}

// Digits only ("83") find serials whose number is 83 or ends in 83 (A083, A1083); anything else searches serial, design, caliber, model.
function matches(r, q) {
  if (!q) return 0;
  if (/^\d+$/.test(q)) {
    const groups = r.serial.match(/\d+/g) || [];
    if (groups.some(g => parseInt(g, 10) === parseInt(q, 10))) return 2;
    return groups.some(g => g.endsWith(q)) ? 1 : -1;
  }
  const t = q.toLowerCase();
  return [r.serial, r.design, r.caliber, r.model].some(v => String(v || "").toLowerCase().includes(t)) ? 1 : -1;
}

function renderList() {
  const q = $("q").value.trim();
  $("chips").innerHTML = Object.entries(FILTERS).filter(([k, f]) => k === "all" || items.some(f[1]))
    .map(([k, f]) => `<button class="chip${k === filter ? " on" : ""}" data-f="${k}" type="button">${f[0]}</button>`).join("");
  const rows = items.filter(FILTERS[filter][1]).map(r => [r, matches(r, q)]).filter(([, m]) => m >= 0)
    .sort((a, b) => b[1] - a[1]).map(([r]) => r);
  $("list").innerHTML = rows.map(r => `<button class="row${r.serial === sel ? " sel" : ""}" data-s="${esc(r.serial)}" type="button">
      <div style="flex:1;min-width:0"><div class="serial">${esc(r.serial)}</div>
      <div class="sub">${esc(r.caliber)}${r.length ? " · " + esc(r.length) + '"' : ""}${r.design ? " · " + esc(r.design) : ""}${r.model ? " · " + esc(r.model) : ""}</div></div>
      ${pill(r)}</button>`).join("") || `<div class="empty">${q ? "Nothing matches that." : "Nothing here."}</div>`;
}

function renderDetail() {
  const r = items.find(x => x.serial === sel);
  const v = $("detailView");
  if (sel === DEVICES && SERVER) return renderDevices();
  if (!r) { v.innerHTML = `<div class="empty">Tap a serial to see it here.</div>`; return; }
  const kv = (k, val) => val ? `<div class="kv"><span>${k}</span><span>${val}</span></div>` : "";
  const canBuild = r.status === "approved" && CAN_BUILD;
  v.innerHTML = `<button class="back" id="back" type="button">‹ Inventory</button>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="big">${esc(r.serial)}</div>${pill(r)}</div>
    <div class="sub" style="font-size:15px;margin-bottom:6px">Caliber ${esc(r.caliber)}${r.length ? " · " + esc(r.length) + '" overall' : ""}${r.barrel ? " · " + esc(r.barrel) + '" barrel' : ""}</div>
    ${r.conditions ? `<div class="note">Approved with conditions: ${esc(r.conditions)}</div>` : ""}
    ${kv("Model", esc(r.model))}${kv("Filed", esc(r.filed))}${kv("Approved", esc(r.approved))}${kv("Application", esc(r.application))}${kv("eForm", esc(r.eform))}
    ${r.pdf ? kv("Approval PDF", `<a href="/pdf/${encodeURIComponent(r.serial)}?k=${encodeURIComponent(KEY)}" target="_blank" rel="noreferrer">Open</a>`) : ""}
    ${r.status === "sbr" ? "" : `<div class="build">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div><div style="font-weight:600">Built</div><div class="sub">${canBuild ? (r.built ? "Made, in your inventory" : "Approved, not made yet") : r.status !== "approved" ? "Only approved suppressors can be built" : "Read-only on the server for now"}</div></div>
        <button class="sw" id="sw" role="switch" aria-checked="${r.built}" aria-label="Built" type="button"${canBuild ? "" : " disabled"}></button>
      </div>
      ${asking === r.serial ? `<div class="ask">Clear the build record of ${esc(r.serial)}?<div class="design">
        <button class="keep" id="keep" type="button">Keep it</button><button class="save" id="clear" type="button">Clear</button></div></div>`
      : r.built ? `<div class="design"><input id="design" value="${esc(r.design)}" placeholder="Design, like PCC Short" aria-label="Design" enterkeyhint="done">
        <button class="save" id="save" type="button">Save</button></div>` : ""}
    </div>`}
    ${SERVER ? `<div class="hist" id="hist"></div>` : ""}`;
  if (SERVER) loadHistory(r.serial);
  $("back").onclick = showList;
  // Turning Built off asks on the page: a confirm() pop-up can be blocked on a phone, and then nothing happens.
  if ($("sw")) $("sw").onclick = () => { if (r.built) { asking = asking === r.serial ? null : r.serial; renderDetail(); } else setBuilt(r, true, r.design); };
  if ($("keep")) $("keep").onclick = () => { asking = null; renderDetail(); };
  if ($("clear")) $("clear").onclick = () => { asking = null; setBuilt(r, false, ""); };
  if ($("save")) $("save").onclick = () => setBuilt(r, true, $("design").value);
  if ($("design")) $("design").onkeydown = e => { if (e.key === "Enter") setBuilt(r, true, e.target.value); };
}

const OPS = {import: "Added (import)", add_queued: "Queued", edit_queued: "Edited", remove_queued: "Removed", mark_pending: "Pending",
  mark_filed: "Filed", unmark_pending: "Back to queued", record_approvals: "Approved", set_built: "Built", clear_built: "Build cleared"};
const day = iso => new Date(iso).toLocaleDateString();
async function loadHistory(serial) {
  const res = await fetch(`/api/history/${encodeURIComponent(serial)}`);
  if (!res.ok || sel !== serial || !$("hist")) return;
  const h = (await res.json()).history;
  $("hist").innerHTML = h.length ? `<h2>History</h2>` + h.map(e => `<div class="kv"><span>${esc(day(e.at))}</span>
    <span>${esc(OPS[e.operation] || e.operation)}${e.after && e.after.design ? " · " + esc(e.after.design) : ""} · ${esc(e.device)}</span></div>`).join("") : "";
}

// Pairing: a browser that isn't paired gets this instead of the inventory. The code comes from Devices on a paired
// device, or the server's pair-code command; the key comes back as a cookie this page never sees.
// "Trust this server": the server's own CA, installed once per phone, so its home-network address opens without
// warnings (no tailnet or domain needed). Not shown at a tailnet name (Tailscale's certificate is trusted already).
const OWN_HTTPS = location.protocol === "https:" && !location.hostname.endsWith(".ts.net");
function trustHelp(fingerprint) {
  if (!OWN_HTTPS) return "";
  return `<details class="hist" id="trust"><summary><b>Trust this server on this device</b> <span class="sub">(once: no more security warning here)</span></summary>
    <p class="hint" style="margin:8px 0">1. <a href="/ca.crt" id="cadl">Download its certificate</a> and allow the download.<br>
    2. iPhone/iPad: Settings › Profile Downloaded › Install.<br>
    3. <b>Then turn it on</b> (installing alone isn't enough): Settings › General › About › Certificate Trust Settings
    (at the bottom) › <b>ATF inventory server CA</b>.<br>
    Android instead: open the file, or Settings › Security › Install a certificate › CA certificate.<br>
    4. Close this tab (or Safari) and open this address again: no "Not Secure" any more.</p>
    ${fingerprint ? `<div class="fp">${esc(fingerprint)}</div><div class="sub">Its fingerprint: the same as the server's log and the app on your PC show.</div>` : ""}
  </details>`;
}

function showPair() {
  document.body.classList.add("pairing"); document.body.classList.remove("detail");
  const ua = navigator.userAgent, guess = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android phone" : "Browser";
  $("listView").innerHTML = `<h1>Inventory</h1><p class="sum">This device isn't paired with the inventory server yet.</p>
    <p class="hint">On a paired device, open Devices and tap Add a device, or run <code>pair-code</code> on the server. Enter that code here.</p>
    <div class="design"><input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" aria-label="Pairing code"></div>
    <div class="design"><input id="devname" value="${esc(guess)}" placeholder="Name, like iPhone" aria-label="Name for this device">
      <button class="save" id="pairbtn" type="button">Pair</button></div>${trustHelp("")}`;
  fetch("/api/hello").then(r => r.json()).then(h => { if ($("trust") && h.ca_fingerprint) $("trust").outerHTML = trustHelp(h.ca_fingerprint); }).catch(() => {});
  $("pairbtn").onclick = async () => {
    const res = await fetch("/api/pair", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code: $("code").value.trim(), name: $("devname").value.trim()})});
    if (res.ok) return location.reload();
    toast((await res.json().catch(() => ({}))).error || "Not paired.");
  };
  $("code").focus();
}

async function renderDevices() {
  const v = $("detailView");
  const res = await fetch("/api/devices");
  if (res.status === 401) return location.reload();
  const d = await res.json();
  if (sel !== DEVICES) return;
  if (pairCode && new Date(pairCode.expires) < new Date()) pairCode = null;
  const devs = d.devices.filter(x => !x.revoked_at);
  v.innerHTML = `<button class="back" id="back" type="button">‹ Inventory</button><div class="big" style="font-size:26px">Devices</div>
    <div class="devs">${devs.map(x => `<div class="kv"><span>${esc(x.name)}${x.id === d.you ? " (this one)" : ""}<br>
      <small>paired ${esc(day(x.created_at))}${x.last_seen ? " · seen " + esc(day(x.last_seen)) : ""}</small></span>
      <button type="button" data-rm="${x.id}">Remove</button></div>`).join("")}</div>
    <div class="build">${pairCode ? `<div style="font-weight:600">Pairing code</div><div class="code" id="paircode">${esc(pairCode.code)}</div>
      <div class="sub">Enter it on the new device within ${pairCode.minutes} minutes. It works once.</div>`
      : `<button class="save" id="addDevice" type="button">Add a device</button>
      <div class="sub" style="margin-top:8px">Shows a code to enter on the new device (a phone, or the app on your PC).</div>`}</div>
    <div class="hist"><h2>Server certificate authority</h2><div class="fp">${esc(d.fingerprint || "(plain HTTP: no certificate)")}</div>
      <div class="sub">The app shows this when you pair your PC: they should match.</div></div>${trustHelp("")}`;
  $("back").onclick = showList;
  if ($("addDevice")) $("addDevice").onclick = async () => {
    const r = await fetch("/api/devices/code", {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
    if (r.ok) { pairCode = await r.json(); renderDevices(); } else toast("No code made.");
  };
  v.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Tap again to remove"; return; }  // asks on the page, no pop-up
    const r = await fetch(`/api/devices/${b.dataset.rm}/revoke`, {method: "POST", headers: {"Content-Type": "application/json"}, body: "{}"});
    if (!r.ok) return toast((await r.json().catch(() => ({}))).error || "Not removed.");
    if (Number(b.dataset.rm) === d.you) return location.reload();
    toast("Removed"); renderDevices();
  });
}

const requestId = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
async function setBuilt(r, built, design) {
  design = (design || "").trim();
  // The server: a named operation with the row's version (another device's change since = 409, shown, not overwritten)
  // and a request id (a retried request isn't applied twice). The PC's own page: its /api/build.
  const [url, body] = SERVER
    ? [built ? "/api/ops/set_built" : "/api/ops/clear_built",
       built ? {request_id: requestId(), items: [{serial: r.serial, design, version: r.version}]}
             : {request_id: requestId(), serial: r.serial, version: r.version}]
    : [`/api/build?k=${encodeURIComponent(KEY)}`, {serial: r.serial, built, design}];
  const res = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const out = await res.json().catch(() => ({}));
  if (res.status === 409) { toast("Changed on another device: here it is now."); asking = null; await load(); renderDetail(); return; }
  if (!res.ok) { toast(out.error || "Not saved."); return; }
  toast(built ? `${r.serial} saved as built` : `${r.serial} is no longer marked built`);
  await load(); renderDetail();
  if (built && !design && $("design")) $("design").focus();
}

// The URL's #serial is the screen: a detail is a history entry of its own (pushState), so the phone's back button and
// swipe return to the list. "‹ Inventory" doesn't rely on that entry being there (opened at #serial, or a browser
// that didn't keep it): it goes back only to an entry this page made, else switches to the list in place.
let listY = 0;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h) sel = h;
  document.body.classList.toggle("detail", !!h);
  renderList(); renderDetail();
  if (!h) window.scrollTo(0, listY);
}
function open(serial) {
  listY = window.scrollY;
  history.pushState({serial}, "", "#" + encodeURIComponent(serial));
  route(); window.scrollTo(0, 0);
}
function showList() {
  if (history.state && history.state.serial) {
    history.back();
    setTimeout(() => { if (location.hash) { history.replaceState(null, "", location.pathname + location.search); route(); } }, 400);
  } else {
    history.replaceState(null, "", location.pathname + location.search); route();
  }
}
window.addEventListener("popstate", route);
window.addEventListener("hashchange", route);
$("list").onclick = e => { const b = e.target.closest(".row"); if (b) open(b.dataset.s); };
$("chips").onclick = e => { const b = e.target.closest(".chip"); if (b) { filter = b.dataset.f; renderList(); } };
$("q").oninput = renderList;
$("pad").onclick = () => {
  const q = $("q"), num = q.inputMode !== "numeric";
  q.inputMode = num ? "numeric" : "text"; q.pattern = num ? "[0-9]*" : "";
  q.placeholder = num ? "Serial number, like 83" : "Serial or design";
  $("pad").textContent = num ? "ABC" : "123"; $("pad").setAttribute("aria-label", num ? "Switch to letters" : "Switch to the number pad");
  q.blur(); q.focus();
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if (location.hash) { sel = decodeURIComponent(location.hash.slice(1)); document.body.classList.add("detail"); }
load();
</script>
