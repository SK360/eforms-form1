# docker compose up -d   (from this folder). Data lives in the "inventory-data" volume: inventory.db, approved/
# PDFs, tls/ (the server's certificate), backups/. First pairing code: docker compose logs, or
#   docker compose exec inventory python -m atf_server pair-code
services:
  inventory:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - inventory-data:/data
    environment:
      ATF_SERVER_NAME: ATF inventory
      # ATF_NAMES: atf-inventory.home.arpa   # extra names for the certificate (the app pins it either way)

volumes:
  inventory-data:
